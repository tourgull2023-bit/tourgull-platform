name: Foundation checks
on:
  push:
    branches: ['feature/tg-eng-001-foundation']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install dependencies (lockfile-aware)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: docker compose config --quiet
      - name: Build and start all services
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: docker compose up --build -d --wait
      - name: Verify API and dependency readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused http://localhost:8000/health
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused http://localhost:8000/ready
      - name: Apply and verify PostgreSQL migrations
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: |
          set -euo pipefail
          docker compose exec -T backend alembic -c alembic.ini upgrade head
          docker compose exec -T backend alembic -c alembic.ini current | grep -q '002_trusted_memberships'
          docker compose exec -T postgres psql -U tourgull -d tourgull -tAc "SELECT to_regclass('public.platform_settings') IS NOT NULL AND to_regclass('public.trusted_memberships') IS NOT NULL" | grep -q t
      - name: Verify SvelteKit response
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused http://localhost:3000/ | grep -q Tourgull
      - name: Report service status
        if: always()
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: docker compose ps
      - name: Tear down test environment
        if: always()
        env:
          POSTGRES_PASSWORD: ci-temporary-password
        run: docker compose down -v --remove-orphans
